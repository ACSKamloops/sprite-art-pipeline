name: Offline pipeline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Local codec and native font dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libfreetype-dev fonts-dejavu-core
      - name: Hashed Python environment
        run: |
          python -m pip install --require-hashes -r workbench/requirements-local.lock
          python -m pip install --no-deps --no-build-isolation -e workbench
      - name: Offline verification (no provider jobs)
        run: python scripts/verify.py
      - name: Retain actual receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-verification
          path: output/verification/
          if-no-files-found: warn
